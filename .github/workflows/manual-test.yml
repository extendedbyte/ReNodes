name: Manual Test Run

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Which tests to run'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - unit
        - performance
        - integration
        - startup-only
      
      skip_dependencies:
        description: 'Skip dependency installation'
        required: false
        default: false
        type: boolean

jobs:
  manual-test:
    name: Manual Test Execution
    runs-on: windows-latest
    timeout-minutes: 45
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      if: ${{ !inputs.skip_dependencies }}
      run: |
        echo "Installing Python dependencies..."
        python -m pip install --upgrade pip
        echo "Attempting to install pytest and coverage..."
        python -m pip install pytest coverage || echo "Failed to install pytest/coverage - will use basic tests"
        
    - name: Prepare test environment
      run: |
        if (!(Test-Path "tests\reports")) { New-Item -ItemType Directory -Path "tests\reports" -Force }
        "Mock library content" | Out-File -FilePath "lib.obj" -Encoding UTF8
        "manual-test-guid" | Out-File -FilePath "lib_guid" -Encoding UTF8
        if (!(Test-Path "data")) { New-Item -ItemType Directory -Path "data" -Force }
        $base64 = "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAHggJ/PchI7wAAAABJRU5ErkJggg=="
        $bytes = [System.Convert]::FromBase64String($base64)
        [System.IO.File]::WriteAllBytes("data\splash.png", $bytes)
      shell: pwsh
        
    - name: Run Unit Tests
      if: ${{ inputs.test_type == 'all' || inputs.test_type == 'unit' }}
      run: |
        echo "Running unit tests..."
        if python -c "import pytest" 2>$null; then
          echo "Using pytest for unit tests"
          python -m pytest tests/ -v --tb=short --junitxml=tests/reports/manual_junit.xml
        else
          echo "pytest not available, running basic tests"
          python tests/test_minimal.py
          python tests/test_basic_imports.py
        fi
      shell: pwsh
      
    - name: Run Performance Tests
      if: ${{ inputs.test_type == 'all' || inputs.test_type == 'performance' }}
      run: |
        echo "Running performance tests..."
        try {
          python -c "import pytest"
          echo "Using pytest for performance tests"
          python -m pytest tests/test_performance.py -v --tb=short
        } catch {
          echo "pytest not available, skipping performance tests"
          echo "Performance tests require pytest to run properly"
        }
      shell: pwsh
      timeout-minutes: 20
      
    - name: Run Integration Tests
      if: ${{ inputs.test_type == 'all' || inputs.test_type == 'integration' }}
      run: |
        echo "Running integration tests..."
        try {
          python -c "import pytest"
          echo "Using pytest for integration tests"
          python -m pytest tests/test_graph_compilation.py tests/test_application.py -v --tb=short
        } catch {
          echo "pytest not available, skipping integration tests"
          echo "Integration tests require pytest to run properly"
        }
      shell: pwsh
      timeout-minutes: 15
      
    - name: Test Application Startup
      if: ${{ inputs.test_type == 'all' || inputs.test_type == 'startup-only' }}
      run: |
        echo "Testing application startup..."
        $job = Start-Job -ScriptBlock { python main.py -noapp -nosplash -debug }
        if (Wait-Job $job -Timeout 60) {
          Receive-Job $job
          echo "Startup test completed"
        } else {
          Stop-Job $job
          echo "Startup test timed out after 60 seconds"
        }
        Remove-Job $job -Force
      continue-on-error: true
      shell: pwsh
      
    - name: Upload Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: manual-test-results-${{ github.run_number }}
        path: |
          tests/reports/
          *.log
        retention-days: 7
        
    - name: Test Summary
      if: always()
      run: |
        "## Manual Test Results" >> $env:GITHUB_STEP_SUMMARY
        "" >> $env:GITHUB_STEP_SUMMARY
        "**Test Type:** ${{ inputs.test_type }}" >> $env:GITHUB_STEP_SUMMARY
        "**Branch:** ${{ github.ref_name }}" >> $env:GITHUB_STEP_SUMMARY
        "**Commit:** ${{ github.sha }}" >> $env:GITHUB_STEP_SUMMARY
        "" >> $env:GITHUB_STEP_SUMMARY
        
        if (Test-Path "tests\reports\manual_junit.xml") {
          "✅ Tests completed - check artifacts for details" >> $env:GITHUB_STEP_SUMMARY
        } else {
          "⚠️ No test results found" >> $env:GITHUB_STEP_SUMMARY
        }
      shell: pwsh