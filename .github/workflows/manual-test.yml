name: Manual Test Run

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Which tests to run'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - unit
        - performance
        - integration
        - startup-only
      
      skip_dependencies:
        description: 'Skip dependency installation'
        required: false
        default: false
        type: boolean

jobs:
  manual-test:
    name: Manual Test Execution
    runs-on: windows-latest
    timeout-minutes: 45
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      if: ${{ !inputs.skip_dependencies }}
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt
        
    - name: Prepare test environment
      run: |
        mkdir -p tests/reports
        echo "Mock library content" > lib.obj
        echo "manual-test-guid" > lib_guid
        mkdir -p data
        echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAHggJ/PchI7wAAAABJRU5ErkJggg==" | base64 -d > data/splash.png
        
    - name: Run Unit Tests
      if: ${{ inputs.test_type == 'all' || inputs.test_type == 'unit' }}
      run: |
        python -m pytest tests/ -v --tb=short -m "unit or not slow" --junitxml=tests/reports/manual_junit.xml
      continue-on-error: true
      
    - name: Run Performance Tests
      if: ${{ inputs.test_type == 'all' || inputs.test_type == 'performance' }}
      run: |
        python -m pytest tests/test_performance.py -v --tb=short -m "slow"
      continue-on-error: true
      timeout-minutes: 20
      
    - name: Run Integration Tests
      if: ${{ inputs.test_type == 'all' || inputs.test_type == 'integration' }}
      run: |
        python -m pytest tests/test_graph_compilation.py tests/test_application.py -v --tb=short
      continue-on-error: true
      timeout-minutes: 15
      
    - name: Test Application Startup
      if: ${{ inputs.test_type == 'all' || inputs.test_type == 'startup-only' }}
      run: |
        echo "Testing application startup..."
        timeout 60 python main.py -noapp -nosplash -debug || echo "Startup test completed"
      continue-on-error: true
      
    - name: Upload Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: manual-test-results-${{ github.run_number }}
        path: |
          tests/reports/
          *.log
        retention-days: 7
        
    - name: Test Summary
      if: always()
      run: |
        echo "## Manual Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Test Type:** ${{ inputs.test_type }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -f "tests/reports/manual_junit.xml" ]; then
          echo "✅ Tests completed - check artifacts for details" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ No test results found" >> $GITHUB_STEP_SUMMARY
        fi